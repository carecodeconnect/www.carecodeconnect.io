project:
  type: website
  output-dir: docs
  render:
    # Only .qmd is a page. Quarto's default sweeps up every .md in the project,
    # which published the agent notes at /CLAUDE.html and an image-credits file
    # at /projects/ai-data-job-skills/images/external/SOURCES.html. Negating
    # those ("!CLAUDE.md") does not work in Quarto 1.8, so the list is positive.
    # A new page must therefore be .qmd, or be added here.
    - "*.qmd"
    - "posts/**/*.qmd"
    - "projects/**/*.qmd"

execute:
  freeze: auto   # re-run a page's code only when its source changes; serve cached output otherwise

website:
  title: "carecodeconnect"
  site-url: https://www.carecodeconnect.io
  description: "Revisioning data science for the age of AI"
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: blog.qmd
        text: Blog
      - href: projects.qmd
        text: Projects
      - href: testimonials.qmd
        text: Testimonials
      - icon: rss
        href: blog.xml

format:
  html:
    theme:
      light:
        - default
        - theme-minimal.scss
      dark:
        - default
        - theme-minimal-dark.scss
    highlight-style:
      light: github
      dark: github-dark
    css: css/styles.css
    toc: false
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">



